<header>
  <img src="img/logo-cooperadora.png" alt="Cooperadora">
  <h1>COOPERADORA DEL HOSPITAL SAN JUAN BAUTISTA</h1>
</header>

<section id="turno">
  <button id="btnIniciarTurno">INICIAR TURNO</button>
  <button id="btnFinalizarTurno" disabled>FINALIZAR TURNO</button>
  <span id="estadoTurno">SIN TURNO ACTIVO</span>
</section>

<section id="venta">
  <label>MONTO DEL BONO</label>
  <input type="number" id="monto" min="0" step="100">

  <label>MEDIO DE PAGO</label>
  <select id="medioPago">
    <option value="EFECTIVO" selected>EFECTIVO</option>
    <option value="TRANSFERENCIA">TRANSFERENCIA</option>
  </select>

  <div id="bloqueTransferencia" style="display:none">
    <label>A NOMBRE DE</label>
    <input type="text" id="titularTransferencia">
  </div>

  <label>SERVICIO DESTINO</label>
  <select id="servicio"></select>
  <button id="btnAgregarServicio">+ AGREGAR SERVICIO</button>

  <button id="btnGenerarBono">GENERAR BONO</button>
</section>

<!-- Ticket oculto (solo visible al imprimir) -->
<div id="ticket" class="ticket-print">
  <div class="centro bold">COOPERADORA DEL HOSPITAL SAN JUAN BAUTISTA</div>
  <div class="centro">--------------------------------</div>
  <div id="tkFecha"></div>
  <div id="tkHora"></div>
  <div id="tkMonto"></div>
  <div class="centro">--------------------------------</div>
  <div class="centro bold">¡GRACIAS POR SU COLABORACIÓN!</div>
</div>
